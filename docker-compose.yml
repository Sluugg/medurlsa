# No manual setup needed for ./data or ./backgrounds — the container starts
# as root just long enough to chown them to its unprivileged user (UID/GID
# 1000) on every start, then drops privileges before running the app (see
# docker-entrypoint.sh). This covers the common case where Docker
# auto-creates a missing bind-mount source directory as root:root.

services:
  medurlsa:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever DB_PATH/BACKGROUNDS_DIR say in .env — that file is
      # written for a native (non-Docker) install, where those are host
      # paths. Inside the container they're fixed by the volumes below.
      DB_PATH: /app/data/links.db
      BACKGROUNDS_DIR: /app/backgrounds
    volumes:
      - ./data:/app/data
      - ./backgrounds:/app/backgrounds
      # Dedicated home for logo_path — deliberately separate from
      # ./backgrounds, which is scanned wholesale for the background picker
      # and random-background selection. A logo dropped into ./backgrounds
      # would show up there too. Point logo_path at e.g.
      # "branding/logo.png" (relative — resolves against the container's
      # /app working directory, matching this mount).
      - ./branding:/app/branding
      # Bind-mounted (not just referenced via env_file above) so writes from
      # the admin settings page land on the real host .env, not just the
      # container's own throwaway filesystem layer — env_file only injects
      # variables at container creation, it doesn't give the container a
      # live view of the file. Requires .env to already exist on the host
      # (README step 1) — same as env_file above already does.
      - ./.env:/app/.env
      # Bind-mounted for the same reason as .env above — otherwise a
      # content_config save from the admin settings page would only land on
      # the container's own throwaway filesystem layer and be lost on the
      # next `docker compose down`. Not :ro — the settings page needs to
      # write it. 
      - ./content_config.json:/app/content_config.json
