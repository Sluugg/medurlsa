# No manual setup needed for ./data or ./backgrounds — the container starts
# as root just long enough to chown them to its unprivileged user (UID/GID
# 1000) on every start, then drops privileges before running the app (see
# docker-entrypoint.sh). This covers the common case where Docker
# auto-creates a missing bind-mount source directory as root:root.

services:
  web-share-app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever DB_PATH/BACKGROUNDS_DIR say in .env — that file is
      # written for a native (non-Docker) install, where those are host
      # paths. Inside the container they're fixed by the volumes below.
      DB_PATH: /app/data/links.db
      BACKGROUNDS_DIR: /app/backgrounds
    volumes:
      - ./data:/app/data
      - ./backgrounds:/app/backgrounds
      # Uncomment to use a custom content_config.json (site title, logo,
      # flavor text, timing). Create the file first — e.g.
      # `cp content_config.example.json content_config.json` — Docker will
      # mount an empty directory instead of a file if the source is missing.
      # - ./content_config.json:/app/content_config.json:ro
